  <script>
    // Deadline and skip stay independent of module, image and font requests.
    window.creativeOSBootStarted=Date.now();
    document.querySelector('.hello-write-path')?.addEventListener('animationend',()=>document.getElementById('startup-screen')?.setAttribute('data-hello-ready','true'),{once:true});
    if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)document.getElementById('startup-screen')?.setAttribute('data-hello-ready','true');
    (()=>{
      let closing=false,done=false,deadline,settleDeadline;
      const complete=()=>{if(done)return;done=true;clearTimeout(deadline);clearTimeout(settleDeadline);document.getElementById('startup-screen')?.remove();window.dispatchEvent(new Event('creativeos-startup-finished'));};
      window.finishCreativeOSStartup=function(immediate){
        if(immediate===true){complete();return;}if(done||closing)return;closing=true;
        const screen=document.getElementById('startup-screen');if(!screen){complete();return;}
        // Always paint the complete lettering before fading, even after dropped frames.
        screen.setAttribute('data-hello-ready','true');
        const leave=()=>{if(done)return;screen.classList.add('startup-leaving');setTimeout(complete,700);};
        if(immediate?.type==='click')leave();else setTimeout(leave,200);
      };
      document.getElementById('startup-skip')?.addEventListener('click',window.finishCreativeOSStartup);
      deadline=setTimeout(()=>window.finishCreativeOSStartup(true),8000);
      settleDeadline=setTimeout(()=>window.finishCreativeOSStartup(),7000);
    })();
  </script>
